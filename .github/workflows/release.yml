# Release: `just release <version>` commits the version bump and tags it v<version>; pushing the
# tag builds zapper-server (the static binary for Linux and a zip for Windows), checks them, and
# uploads them with SHA256SUMS to a *draft* GitHub release for review. Nothing is published
# until someone presses Publish.
#
# This line ships zapper-server and the browser interface it serves; the desktop app is being
# rebuilt, so there are no installers, .deb, .rpm or Arch packages here (the Tauri app's, 0.4.x,
# are released from the main-tauri branch).
#
# - a pushed v* tag builds that tag and drafts its release;
# - "Run workflow" (workflow_dispatch) with a tag does the same for that tag (to redo or rescue
#   a release); without one it is a dry run: the same build and checks, the files kept as
#   workflow artifacts, no release.
#
# The version is the one in [workspace.package] in Cargo.toml (scripts/version.py current); a tag
# must match it.
#
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release this tag (v1.2.3): build its commit and draft the release. Empty: a dry run.'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keep in step with scripts/licenses.sh's install hint and docs/licensing.md.
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: What this run builds and releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag='' sha=$GITHUB_SHA
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$INPUT_TAG" ]; then
              tag=$INPUT_TAG
              # Through the API with the job's token: an unauthenticated
              # `git ls-remote` can't see a private repository. A lightweight
              # tag points at its commit; an annotated one at a tag object,
              # which points at the commit.
              ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha') ||
                { echo "::error::No tag $tag on $GH_REPO"; exit 1; }
              read -r type sha <<<"$ref"
              if [ "$type" = tag ]; then
                sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.sha')
              fi
              [ -n "$sha" ] || { echo "::error::Couldn't resolve $tag to a commit"; exit 1; }
            fi
          else
            tag=$GITHUB_REF_NAME
          fi
          echo "tag=${tag:-none (dry run)} sha=$sha"
          { echo "tag=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  # zapper-server for Linux as one static file, zapper-server-<version>-linux-x86_64: built for
  # x86_64-unknown-linux-musl in a pinned Rust image on Alpine, with a minimal static LGPL FFmpeg
  # (scripts/build-ffmpeg-static.sh, cached on what it is made from) and its licence notices
  # built in (scripts/build-server-static.sh). Then scripts/check-server-binary.sh: statically
  # linked, run in bare debian:stable-slim and alpine containers and from scratch, its sample
  # Dockerfile, and the fixture streams recorded through it by recording_check, built for the
  # same target. This job also checks the tag against the version and writes the release notes.
  server:
    name: Build and check the static zapper-server
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # The tag must be the version the binaries are built as, and the updater inside them must
      # take its releases from this repository: a build pointing at the placeholder, or at
      # another repository, would ship builds that never find their next update.
      - name: Version and releases repository
        id: version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          conf=$(python3 scripts/version.py current)
          if [ -n "$TAG" ]; then
            v=${TAG#v}
            if [ "$v" != "$conf" ]; then
              echo "::error::The tag $TAG doesn't match the workspace version $conf in Cargo.toml; tag with 'just release <version>'."
              exit 1
            fi
          else
            v=$conf
          fi
          python3 scripts/version.py check "$v"
          repo=$(scripts/releases-repo.sh)
          if [ "${repo,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            msg="RELEASES_REPO in crates/zapper-core/src/updates/mod.rs is '$repo', not this repository ($GITHUB_REPOSITORY). See docs/releasing.md, One-time setup."
            if [ -n "$TAG" ]; then echo "::error::$msg"; exit 1; else echo "::warning::$msg"; fi
          fi
          { echo "version=$v"; echo "prerelease=$(python3 scripts/version.py prerelease "$v")"; } >> "$GITHUB_OUTPUT"
          echo "Version $v (pre-release: $(python3 scripts/version.py prerelease "$v")), releases from $repo"

      # Before the long build: a tag needs its CHANGELOG.md section (just release writes it).
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p out
          if python3 scripts/changelog.py notes "$VERSION" CHANGELOG.md > out/release-notes.md; then
            echo "Release notes: $(wc -l < out/release-notes.md) lines"
          elif [ -n "$TAG" ]; then
            exit 1
          else
            echo "::warning::No CHANGELOG.md section for $VERSION (fine for a dry run)."
            rm out/release-notes.md
          fi

      # The Rust notices it carries, from Linux's crate graph (the musl build's is the same
      # crates), and the interface it serves, with its own notices.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: License notices
        run: scripts/licenses.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the interface
        run: npm run build

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/static/ffmpeg
            target/static/sources
          key: server-ffmpeg-${{ hashFiles('packaging/libmpv/sources.txt', 'scripts/build-ffmpeg-static.sh') }}

      - name: Build the static zapper-server
        run: CARGO_BUILD_JOBS=$(nproc) scripts/build-server-static.sh out --with-checks

      - name: Check it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/check-server-binary.sh "out/zapper-server-${VERSION}-linux-x86_64" out/checks

      - name: SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf out/checks
          [ -f "out/zapper-server-${VERSION}-linux-x86_64" ] || { echo "::error::Missing the binary"; exit 1; }
          (cd out && sha256sum -- zapper-server-* > SHA256SUMS && cat SHA256SUMS && ls -l)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zapper-${{ steps.version.outputs.version }}-server
          path: out/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true

  # zapper-server for Windows, zapper-server-<version>-windows-x86_64.zip: zapper-server.exe, the
  # libmpv and FFmpeg DLLs it loads, and the license notices, to unzip anywhere. Unsigned, so
  # SmartScreen warns on the first run. The version check is repeated here, so it doesn't wait on
  # the Linux job.
  windows:
    name: Build and check zapper-server for Windows
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Version
        id: version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $conf = (python scripts/version.py current).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $v = $conf
          if ($env:TAG) {
            $v = $env:TAG.Substring(1)
            if ($v -ne $conf) { throw "The tag $env:TAG doesn't match the workspace version $conf in Cargo.toml" }
          }
          python scripts/version.py check $v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version $v"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # zapper's LGPL libmpv-2.dll and FFmpeg's DLLs, the archive packaging/libmpv/manifest.json
      # names, and the import libraries the link needs, into lib/windows-x86_64
      # (docs/windows.md). The manifest pins it: a release changes libmpv only when that file
      # does.
      - name: Fetch libmpv
        run: ./tools/fetch-libmpv.ps1

      # The license notices the zip carries in licenses\ (docs/licensing.md): the Rust crates'
      # from Windows' graph, in Git for Windows' bash.
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: License notices
        shell: bash
        env:
          PYTHON: python
        run: scripts/licenses.sh

      # The interface, which zapper-server compiles in to serve to browsers (crates/zapper-server/build.rs).
      - name: Build the interface
        run: npm run build

      # zapper-server, built against that FFmpeg.
      # The notices --licenses prints, compiled in as the static build does
      # (scripts/build-server-static.sh): zapper's, the Rust crates', the interface's.
      - name: Build zapper-server
        run: |
          $env:CARGO_BUILD_JOBS = "$env:NUMBER_OF_PROCESSORS"
          $notices = "target/server-notices"
          New-Item -ItemType Directory -Force $notices | Out-Null
          Copy-Item LICENSE "$notices/1-LICENSE.txt"
          Copy-Item target/licenses/THIRD-PARTY-NOTICES-rust.txt "$notices/4-THIRD-PARTY-NOTICES-rust.txt"
          Copy-Item dist/licenses/THIRD-PARTY-NOTICES-ui.txt "$notices/5-THIRD-PARTY-NOTICES-ui.txt"
          $env:ZAPPER_SERVER_NOTICES = (Resolve-Path $notices).Path
          cargo build --release -p zapper-server --bin zapper-server
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The exe, the DLLs it loads and the notices, in one folder, zipped. The name is an API:
      # the release job and docs/releasing.md name it.
      - name: Collect the zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $dir = "stage/zapper-server-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force $dir, out | Out-Null
          Copy-Item target/release/zapper-server.exe $dir/
          Copy-Item lib/windows-x86_64/runtime/*.dll $dir/
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item -Recurse target/licenses/* "$dir/licenses/"
          Copy-Item LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "out/zapper-server-$env:VERSION-windows-x86_64.zip"

      # Unpacks it and runs what it says: the version it was built as, its notices, and the
      # DLLs beside the exe (a missing one fails to start, here, not on a user's machine).
      - name: Check the zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Expand-Archive "out/zapper-server-$env:VERSION-windows-x86_64.zip" -DestinationPath check
          $exe = "check/zapper-server-$env:VERSION-windows-x86_64/zapper-server.exe"
          # zapper-server is a windowless program: PowerShell waits for one only when its output
          # is piped, so each run goes through Out-String (as scripts/check-windows.ps1 did).
          $say = (& $exe --version 2>&1 | Out-String)
          if ($LASTEXITCODE) { throw "zapper-server.exe --version failed" }
          if ($say.Trim() -ne "zapper-server $env:VERSION") { throw "--version says '$say', not 'zapper-server $env:VERSION'" }
          $licenses = (& $exe --licenses 2>&1 | Out-String)
          if ($LASTEXITCODE -or $licenses.Length -lt 1000) { throw "zapper-server.exe --licenses printed no notices" }
          # By name without FFmpeg's major version, so moving FFmpeg to a new major needs no edit here.
          foreach ($dll in 'libmpv-*.dll', 'avcodec-*.dll', 'avformat-*.dll') {
            if (-not (Test-Path "check/zapper-server-$env:VERSION-windows-x86_64/$dll")) { throw "the zip lacks $dll" }
          }
          "ok: $say"

      - name: SHA256SUMS
        run: |
          # sha256sum's format, so the release job checks and merges it with the Linux one.
          $sums = foreach ($f in Get-ChildItem out -File) { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower(), $f.Name }
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS", ($sums -join "`n") + "`n")
          Get-Content out/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zapper-${{ steps.version.outputs.version }}-windows
          path: out/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true

  release:
    name: Draft the GitHub release
    needs: [plan, server, windows]
    # Both builds are the release: a failure or a cancel holds it back rather than drafting it
    # without one by surprise.
    if: >-
      ${{ always() && needs.plan.outputs.tag != '' && needs.server.result == 'success'
      && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # attestations: the Sigstore signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zapper-${{ needs.server.outputs.version }}-*
          path: parts

      # Each job's checksums, then one SHA256SUMS for every file. The updater refuses any
      # package SHA256SUMS doesn't list, so this file is what makes the release installable.
      - name: Verify and merge SHA256SUMS
        run: |
          mkdir dist
          # One folder per job's artifact, except when the run has only one: then the artifact is
          # unpacked straight into parts/. Each job's files sit beside its own SHA256SUMS, so go
          # by those wherever they are.
          notes=$(find parts -name release-notes.md)
          [ "$(wc -l <<<"$notes")" = 1 ] && [ -n "$notes" ] || { echo "::error::expected one release-notes.md, found: $notes"; exit 1; }
          mv "$notes" dist/
          find parts -name SHA256SUMS | while read -r sums; do
            part=$(dirname "$sums")
            (cd "$part" && sha256sum -c SHA256SUMS)
            cat "$sums" >> dist/SHA256SUMS
            find "$part" -maxdepth 1 -type f ! -name SHA256SUMS -exec mv {} dist/ \;
          done
          (cd dist && sha256sum -c SHA256SUMS && cat SHA256SUMS)

      # Attestations need a public repository, or GitHub Enterprise Cloud for a private one:
      # while the repository is private this is skipped unless the ZAPPER_ATTEST variable is
      # 'true'.
      - name: Build provenance
        if: ${{ !github.event.repository.private || vars.ZAPPER_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/zapper-server-*-linux-x86_64
            dist/zapper-server-*-windows-x86_64.zip

      # Creates the draft, or on a re-run updates it and replaces its assets (--clobber). A
      # release that's already published is left alone: the run fails instead.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.server.outputs.version }}
          PRERELEASE: ${{ needs.server.outputs.prerelease }}
        run: |
          shopt -s nullglob
          assets=(dist/zapper-server-*-linux-x86_64 dist/zapper-server-*-windows-x86_64.zip dist/SHA256SUMS)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is already published; not replacing its assets."
              exit 1
            fi
            gh release edit "$TAG" --draft --title "zapper $VERSION" --notes-file dist/release-notes.md --prerelease="$PRERELEASE"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "zapper $VERSION" \
              --notes-file dist/release-notes.md --prerelease="$PRERELEASE" "${assets[@]}"
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Draft release: $url" | tee -a "$GITHUB_STEP_SUMMARY"

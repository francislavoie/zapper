# The checks that need no window, no account and no network beyond the package mirrors, on
# pushes to main and on pull requests, in three jobs by what they build: `core` (no native
# libraries: the Rust unit tests and clippy, the frontend's type check and build, its node
# checks, and the release scripts' tests), `mpv` (the libmpv backend, against the libmpv bundle)
# and `server` (the recording service and the browser interface it serves). tools/check_all.sh
# runs the same locally, plus the player checks on a headless mpv host (`--host`). Releases are
# release.yml. Actions are pinned by commit, as in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Tests, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # jq: the release scripts' tests.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config jq

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # package.json wants Node 26 (.nvmrc).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Rust unit tests
        run: cargo test -p zapper --lib -q

      - name: Clippy
        run: cargo clippy -p zapper --lib --bins -q -- -D warnings

      - name: Frontend build
        run: npm run build

      - name: Frontend checks
        run: node --test src/__checks__/*.test.mjs

      - name: Release scripts
        run: scripts/test-scripts.sh

  # The libmpv backend and the harness bins that use it (features `mpv` and `harness`), against
  # the libmpv bundle that ships, not Ubuntu's (docs/licensing.md). Until the manifest names a
  # published one, Ubuntu's stands in (a debug build links the system's when none was fetched),
  # so the checks still run. The player checks that play video need a host and run locally
  # (tools/check_all.sh --host).
  mpv:
    name: libmpv backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libva: the bundle's libavcodec needs it at load time, and the test binary links FFmpeg
      # directly (the seek bar's previews).
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pkg-config libva2 libva-drm2 libva-wayland2

      - name: libmpv
        run: |
          if python3 scripts/libmpv-manifest.py get linux-x86_64 >/dev/null 2>&1; then
            scripts/fetch-libmpv.sh
          else
            echo "::warning::packaging/libmpv/manifest.json names no published libmpv yet: checking against Ubuntu's libmpv-dev"
            sudo apt-get install -y -q --no-install-recommends libmpv-dev
          fi

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mpv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy, mpv and harness features
        run: cargo clippy -p zapper --lib --bins --features harness,mpv -q -- -D warnings

      - name: Rust tests, mpv feature
        run: cargo test -p zapper --features mpv --lib -q

  # The recording service (feature `server`, off by default) has its own tests, which the jobs
  # above never build. They run against the libmpv bundle that ships, not Ubuntu's; ffmpeg only
  # makes their fixtures. Two of them need dist/, so the frontend is built first.
  server:
    name: Recording service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config ffmpeg

      - name: libmpv
        run: scripts/fetch-libmpv.sh linux-x86_64

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Rust tests, server feature
        run: cargo test -p zapper --lib --no-default-features --features server

      - name: Clippy, server feature
        run: cargo clippy -p zapper --lib --bins --no-default-features --features server -- -D warnings

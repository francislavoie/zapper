# The checks that need no window, no account and no network beyond the package mirrors, on
# pushes to main and on pull requests: Rust's unit tests and clippy, the frontend's type check
# and build, its node checks, and the release scripts' tests. tools/check_all.sh runs the same
# locally, plus the harnesses that need a real display and mpv. Releases are release.yml.
# Actions are pinned by commit, as in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tests, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Linux build dependencies (README.md): WebKitGTK 4.1 and GTK 3 for Tauri 2, libepoxy
      # for the GL surface. jq and dpkg-dev: the release scripts' tests.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev \
            libepoxy-dev pkg-config jq dpkg-dev desktop-file-utils \
            libva2 libva-drm2 libva-wayland2
          # libva: the bundle's libavcodec needs it at load time, and the app's test binary now
          # links FFmpeg directly (the seek bar's previews). The packages depend on it already.

      # libmpv for playback: zapper's own LGPL build, the archive packaging/libmpv/manifest.json
      # names (docs/licensing.md). Until the manifest names a published one, Ubuntu's stands in
      # (a debug build links the system's when none was fetched), so the checks still run.
      - name: libmpv
        run: |
          if python3 scripts/libmpv-manifest.py get linux-x86_64 >/dev/null 2>&1; then
            scripts/fetch-libmpv.sh
          else
            echo "::warning::packaging/libmpv/manifest.json names no published libmpv yet: checking against Ubuntu's libmpv-dev"
            sudo apt-get install -y -q --no-install-recommends libmpv-dev
          fi

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # package.json wants Node 26 (.nvmrc).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Rust unit tests
        working-directory: crates/zapper
        run: cargo test --lib -q

      - name: Clippy
        working-directory: crates/zapper
        run: cargo clippy --lib --bins -q -- -D warnings

      - name: Frontend build
        run: npm run build

      - name: Frontend checks
        run: node --test src/__checks__/*.test.mjs

      - name: Release scripts
        run: scripts/test-scripts.sh

  # The recording service (feature `server`, off by default) has its own tests, which the job
  # above never builds. They run against the libmpv bundle that ships, not Ubuntu's; ffmpeg only
  # makes their fixtures. Two of them need dist/, so the frontend is built first.
  server:
    name: Recording service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev \
            libepoxy-dev pkg-config ffmpeg

      - name: libmpv
        run: scripts/fetch-libmpv.sh linux-x86_64

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Rust tests, server feature
        working-directory: crates/zapper
        run: cargo test --lib --no-default-features --features server

      - name: Clippy, server feature
        working-directory: crates/zapper
        run: cargo clippy --lib --bins --no-default-features --features server -- -D warnings

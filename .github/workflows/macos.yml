# macOS: the port's checks, on the Apple Silicon runners. zapper's own LGPL libmpv for
# macos-arm64 is built here by scripts/build-libmpv.sh (the libmpv workflow publishes it only on
# a manual run) and cached on what it is made from, so only a change to the script or to
# packaging/libmpv/sources.txt builds it again. Against it: Rust's unit tests and clippy, the
# frontend's build and node checks, and zapper-server (built, installed as a LaunchAgent and
# removed). There is no app on this line: the desktop app is being rebuilt, and the Tauri one
# (0.4.x) is on the main-tauri branch.
#
# The runners are slow, so a pull request runs this only when it can change what macOS gets
# (`changes` below decides, on a Linux runner, in seconds): a file in MACOS_PATHS, a Rust file
# with macOS-only code (`target_os = "macos"`), or the `macos` label on the pull request. Every
# Monday and on Run workflow, main gets all of it, so nothing that breaks macOS goes unnoticed
# for long.
#
# The tests job is named "macOS tests", not "Tests, lint and build": that name is the required
# check, and it belongs to ci.yml's Linux job alone. Actions are pinned by commit, as in
# release.yml.
name: macOS

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PLATFORM: macos-arm64

jobs:
  # Whether this pull request needs the macOS runners at all.
  changes:
    name: macOS needed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'macos') }}
          # What macOS gets that Linux CI doesn't exercise.
          MACOS_PATHS: >-
            ^\.github/workflows/macos\.yml$
            ^crates/zapper-core/src/paths\.rs$
            ^crates/zapper-core/src/recording/service(\.rs$|/)
            ^crates/zapper-server/src/bin/zapper_server\.rs$
            ^crates/zapper-(mpv|server)/build\.rs$
            ^Cargo\.(toml|lock)$
            ^crates/zapper-[a-z]+/Cargo\.(toml|lock)$
            ^packaging/libmpv/
            ^scripts/(build|fetch)-libmpv\.sh$
        run: |
          if [ "$EVENT" != pull_request ] || [ "$LABELLED" = true ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request, or labelled macos: everything."; exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          matches() { local re; for re in $1; do grep -Eq -- "$re" <<<"$changed" && return 0; done; return 1; }
          tests=false
          if matches "$MACOS_PATHS"; then tests=true; fi
          # Rust with macOS-only code in it, wherever it lives.
          while IFS= read -r f; do
            case "$f" in
              *.rs) if [ -f "$f" ] && grep -q 'target_os = "macos"' "$f"; then tests=true; fi ;;
            esac
          done <<<"$changed"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "macOS tests: $tests"

  libmpv:
    name: libmpv (macos-arm64)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache key
        id: key
        run: echo "key=libmpv-$PLATFORM-${{ hashFiles('packaging/libmpv/sources.txt', 'scripts/build-libmpv.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Built already?
        id: built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libmpv-out/libmpv-macos-arm64.tar.xz
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # The downloads alone, kept apart from the build so a change to the script reuses them.
      - name: Sources
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libmpv/sources
          key: libmpv-sources-${{ hashFiles('packaging/libmpv/sources.txt') }}

      # Homebrew for the build tools alone (and a bash newer than macOS's 3.2), as in libmpv.yml.
      - name: Build tools
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          brew install --quiet bash meson ninja pkgconf
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        shell: bash
        run: |
          LIBMPV_JOBS=$(sysctl -n hw.ncpu) bash scripts/build-libmpv.sh "$PLATFORM" "$RUNNER_TEMP/libmpv" libmpv-out
          ls -l libmpv-out

      # Saved as soon as it is built, whatever the later jobs make of it.
      - name: Keep it
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libmpv-out/libmpv-macos-arm64.tar.xz
          key: ${{ steps.key.outputs.key }}

  check:
    name: macOS tests
    needs: [changes, libmpv]
    if: needs.changes.outputs.tests == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libmpv-out/libmpv-macos-arm64.tar.xz
          key: ${{ needs.libmpv.outputs.key }}
          fail-on-cache-miss: true

      - name: libmpv
        run: scripts/fetch-libmpv.sh --archive libmpv-out/libmpv-macos-arm64.tar.xz "$PLATFORM"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Rust unit tests, core
        run: cargo test -p zapper-core --lib -q

      - name: Clippy, core
        run: cargo clippy -p zapper-core --lib --features harness -q -- -D warnings

      - name: Clippy, libmpv backend and harnesses
        run: cargo clippy -p zapper-mpv --lib --bins --features harness -q -- -D warnings

      - name: Rust tests, libmpv backend
        run: cargo test -p zapper-mpv --lib -q

      # Before zapper-server, which compiles the interface in to serve it to browsers
      # (crates/zapper-server/build.rs).
      - name: Frontend build
        run: npm run build

      # ffmpeg makes the server tests' fixtures; with CI=1 a missing one fails rather than skips.
      - name: ffmpeg
        run: brew install --quiet ffmpeg

      - name: Rust tests, recording service
        run: CI=1 cargo test -p zapper-server --lib -q

      - name: Clippy, recording service and harnesses
        run: cargo clippy -p zapper-server --lib --bins --features harness -q -- -D warnings

      - name: zapper-server
        run: cargo build --release -p zapper-server --bin zapper-server

      # The recording service's install on a Mac, through the built zapper-server's own
      # --install-service (the same code): the LaunchAgent in ~/Library/LaunchAgents, loaded by
      # launchd, running, answering on a scratch home it is handed and its port, then removed
      # (recording::service::launchd).
      - name: LaunchAgent
        run: |
          set -euo pipefail
          bin=$PWD/target/release/zapper-server
          label=dev.lavoie.zapper.server
          plist=$HOME/Library/LaunchAgents/$label.plist
          export ZAPPER_HOME=$RUNNER_TEMP/zapper-home
          mkdir -p "$ZAPPER_HOME/config"
          echo '{"port": 18796}' > "$ZAPPER_HOME/config/server.json"
          [ ! -e "$plist" ] || { echo "::error::$plist exists already"; exit 1; }
          "$bin" --install-service
          cat "$plist"
          plutil -lint "$plist"
          # The login session's domain, or the background one where there is none.
          uid=$(id -u)
          domain=gui/$uid
          launchctl print "$domain" > /dev/null 2>&1 || domain=user/$uid
          launchctl print "$domain/$label" | head -40
          state=
          for _ in $(seq 1 100); do
            state=$("$bin" --busy 2>/dev/null || true)
            [ "$state" = idle ] && break
            sleep 0.2
          done
          [ "$state" = idle ] || { echo "::error::--busy says '$state', not idle"; tail -50 "$ZAPPER_HOME/data/"*.log || true; exit 1; }
          launchctl print "$domain/$label" | grep -q 'state = running' || { echo "::error::launchd does not say it runs"; exit 1; }
          grep -q "recording service API on http://127.0.0.1:18796" "$ZAPPER_HOME/data/zapper-server.log"
          echo "running under launchd ($domain), idle on 18796"
          "$bin" --remove-service
          [ ! -e "$plist" ] || { echo "::error::$plist left behind"; exit 1; }
          ! launchctl print "$domain/$label" > /dev/null 2>&1 || { echo "::error::launchd still has $label"; exit 1; }
          for _ in $(seq 1 50); do nc -z 127.0.0.1 18796 || break; sleep 0.2; done
          ! nc -z 127.0.0.1 18796 || { echo "::error::something still answers on 18796"; exit 1; }
          grep -q "stopping (signalled)" "$ZAPPER_HOME/data/zapper-server.log" || { echo "::error::it was not stopped cleanly"; tail -20 "$ZAPPER_HOME/data/zapper-server.log"; exit 1; }
          echo "removed, and it stopped cleanly"

      - name: Frontend checks
        run: node --test src/__checks__/*.test.mjs

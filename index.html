<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>zapper</title>
    <style>
      /* Held back until the zoom mechanism has settled. Under Tauri the real
         one is WebKit's page zoom, which is reached over async IPC, so without
         this the first frame paints at 100% and visibly snaps. The window is
         dark and undecorated, so a few milliseconds of nothing reads as the
         app opening rather than as a flash.

         Nothing here paints a background. The page is deliberately
         transparent all the way down — mpv draws beneath the webview, and an
         opaque background anywhere in this document is a hole punched in the
         picture. What stops the uncovered window reading as a white flash is
         the window's own background, which is set to black in Rust. */
      html.zoom-pending {
        visibility: hidden;
      }
    </style>
    <script>
      // Runs before the module bundle, so the very first layout is already at
      // the remembered size even if the reveal below beats the real
      // application of zoom.
      //
      // The key and the bounds are duplicated from src/logic/zoom.ts because
      // nothing importable exists this early. src/__checks__/zoom.test.mjs
      // asserts the two agree, so a change in one cannot drift from the other.
      (function () {
        var root = document.documentElement;
        root.classList.add("zoom-pending");
        var zoom = 1;
        try {
          var stored = parseFloat(localStorage.getItem("zapper.zoom"));
          if (isFinite(stored) && stored > 0) {
            zoom = Math.min(2, Math.max(0.7, stored));
          }
        } catch (e) {
          // Storage unavailable. 100% is the right answer and the app still
          // opens, which is the only thing that matters here.
        }
        root.style.setProperty("--zoom", String(zoom));
        root.style.zoom = String(zoom);
        // If the bundle fails to load or throws before it applies zoom, the
        // interface must still appear. CSS zoom above is already correct, so
        // revealing on a timer costs nothing but removes the only way this
        // could hide the app permanently.
        setTimeout(function () {
          root.classList.remove("zoom-pending");
        }, 600);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "zapper-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# What every front end shares: the catalogue, the sources and the guide, the
# player's controller (driven through a stand-in in tests), the recording
# service's contract and its client, the updater. No native dependency: no
# libmpv, no FFmpeg, no C compiler. zapper-mpv is the player, zapper-server
# the recording service.

[lib]
name = "zapper_core"

[features]
default = []
# For the harnesses in the other crates: `harness` (keeping runs away from
# the real account) and the player's stand-in, `player::fake`.
harness = []
# For the other crates' unit tests, through their dev-dependencies only: the
# test root `paths` keeps every directory under, the in-memory catalogue, the
# local HTTP stand-ins. Never in a build that ships.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "stream", "json"] }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
quick-xml = "0.42"
nucleo = "0.5"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
# The updater's check of a downloaded package against the release's
# SHA256SUMS.
sha2 = "0.10"
# MD5 for HTTP Digest, which is how Tvheadend logs in by default (see
# `tvheadend::digest`). RustCrypto's, on the same `digest` 0.10 that sha2
# already brings, so it is one small crate and nothing under it.
md-5 = "0.10"
# Gzipped XMLTV guides (and the odd gzipped playlist). Already in the tree
# through the PNG stack; named here so it is ours.
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# `statvfs`, for the free space the recording service reports, and the title
# previews' thread priority and processor time. Already in the tree under
# nearly everything.
libc = "0.2"

# Windows: the local UTC offset (System_Time), and what the recording
# service needs below.
[target.'cfg(windows)'.dependencies]
# Com, Ole, Variant and TaskScheduler: the recording service's sign-in task
# (recording::service). Console, Security and Storage_FileSystem:
# zapper-server finding its terminal's console. Services,
# Security_Authorization and Threading: the boot-time Windows service's
# permissions, this user's SID, and asking for elevation to install it
# (recording::service::winsvc); Registry, which ShellExecuteExW needs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The boot-time Windows service (recording::service::winsvc): creating,
# starting, stopping and deleting it through the Service Control Manager.
# MIT OR Apache-2.0, on the windows-sys 0.61 already in the tree; adds
# widestring.
windows-service = "0.8"

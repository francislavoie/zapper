[package]
name = "zapper"
version = "0.1.0"
edition = "2021"
publish = false
# Four verification harnesses live alongside the app, so a bare `cargo run`
# (which is what `tauri dev` issues) cannot tell which to launch.
default-run = "zapper"

[lib]
name = "zapper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "stream", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
quick-xml = "0.42"
nucleo = "0.5"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
libmpv2 = "6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }
libloading = "0.8"

[profile.dev]
incremental = true

[package]
name = "zapper"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
# Verification harnesses live alongside the app, so a bare `cargo run`
# (which is what `tauri dev` issues) cannot tell which to launch.
default-run = "zapper"

# The harnesses are not part of the product.
#
# `tauri build` bundles whatever binaries cargo produced, so without this the
# .deb would install `seek_bench` into /usr/bin beside the app. They are
# behind a feature that is off by default: `cargo build` for the app does not
# build them, and tools/check_all.sh asks for them by name.
[features]
harness = []

[[bin]]
name = "zapper"
path = "src/main.rs"

[[bin]]
name = "ipc_check"
path = "src/bin/ipc_check.rs"
required-features = ["harness"]

[[bin]]
name = "player_check"
path = "src/bin/player_check.rs"
required-features = ["harness"]

[[bin]]
name = "shot_check"
path = "src/bin/shot_check.rs"
required-features = ["harness"]

[[bin]]
name = "surface_check"
path = "src/bin/surface_check.rs"
required-features = ["harness"]

[[bin]]
name = "seek_bench"
path = "src/bin/seek_bench.rs"
required-features = ["harness"]

[[bin]]
name = "filter_bench"
path = "src/bin/filter_bench.rs"
required-features = ["harness"]

[[bin]]
name = "open_bench"
path = "src/bin/open_bench.rs"
required-features = ["harness"]

[[bin]]
name = "ending_check"
path = "src/bin/ending_check.rs"
required-features = ["harness"]

[lib]
name = "zapper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "stream", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
quick-xml = "0.42"
nucleo = "0.5"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
libmpv2 = "7"
# libmpv2-sys is named directly for what the safe wrapper does not expose:
# `mpv_request_log_messages`, which is the only place mpv says what HTTP
# status refused a stream (see `ipc::ending`), and on Windows
# `mpv_command_ret` for `screenshot-raw` (the thumbnails). It is already in
# the tree under libmpv2, and covered by the same license entry.
libmpv2-sys = "4"
# The updater's check of a downloaded package against the release's
# SHA256SUMS. Already in the tree through Tauri; named here so it is ours.
sha2 = "0.10"
# MD5 for HTTP Digest, which is how Tvheadend logs in by default (see
# `tvheadend::digest`). RustCrypto's, on the same `digest` 0.10 that sha2
# already brings, so it is one small crate and nothing under it.
md-5 = "0.10"
# Gzipped XMLTV guides (and the odd gzipped playlist). Already in the tree
# through the PNG stack; named here so it is ours.
flate2 = "1"
# The save and open dialogs for Settings › Data's backups (MIT/Apache-2.0).
# Opened from Rust only: the window has no `dialog:` permission, so the
# webview can neither open one nor name a path to read or write.
tauri-plugin-dialog = "2"

# The desktop's media controls (Settings › Playback, off by default): MPRIS on
# Linux, the System Media Transport Controls on Windows. MIT. Its D-Bus
# backend is the `dbus` crate tao already links, and its Windows one the same
# `windows` 0.62, so on both it is the one crate plus `dbus-crossroads`.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
souvlaki = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

# Symbols out of the already-loaded C library: `setlocale` on Linux, and
# `localtime_r` for the catch-up clock on every Unix.
[target.'cfg(unix)'.dependencies]
libloading = "0.8"

# The Windows surface: a child window for mpv to draw into (WindowsAndMessaging,
# Gdi for its black brush, Shell for subclassing the main window so the child
# follows its size), and the local UTC offset (System_Time). The same 0.62
# that tauri, tao and wry already build, so this adds features, not a crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The MPRIS round trip in `media_keys`'s ignored test, which talks to the
# registration as a desktop would. Already in the tree under tao.
[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus = "0.9"

[profile.dev]
incremental = true

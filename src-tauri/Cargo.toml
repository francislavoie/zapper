[package]
name = "zapper"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false
# Verification harnesses live alongside the app, so a bare `cargo run`
# (which is what `tauri dev` issues) cannot tell which to launch.
default-run = "zapper"

# The harnesses are not part of the product.
#
# `tauri build` bundles whatever binaries cargo produced, so without this the
# .deb would install `seek_bench` into /usr/bin beside the app. They are
# behind a feature that is off by default: `cargo build` for the app does not
# build them, and tools/check_all.sh asks for them by name.
[features]
# The desktop app: Tauri, the webview, libmpv and the toolkit under them. On
# by default, so `cargo build`, `tauri dev` and `tauri build` are the app and
# nothing changes for them.
#
# `--no-default-features --features server` builds `zapper-server`, the
# recording service, on the same catalogue, sources and guide code with none
# of the GUI stack linked: a headless box needs no WebKit, GTK or libmpv.
# A feature rather than a workspace of crates because the core modules are
# shared by path (`crate::catalog`, `crate::source`, ...) throughout, and
# splitting them out would move every file other work is editing.
default = ["gui"]
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:libmpv2",
    "dep:libmpv2-sys",
    "dep:souvlaki",
    "dep:gtk",
    "dep:glib",
    "dep:webkit2gtk",
    "dep:cairo-rs",
]
# The recording service's own pieces: its HTTP API and the remuxer, a small C
# file against libavformat (see build.rs). Not in the app's build.
server = [
    "dep:axum",
    "dep:bytes",
    "dep:cc",
    "dep:futures-core",
    "dep:getrandom",
    "dep:libc",
    "dep:pkg-config",
    "dep:argon2",
    "dep:hyper",
    "dep:hyper-util",
    "dep:if-addrs",
    "dep:rcgen",
    "dep:rustls",
    "dep:socket2",
    "dep:time",
    "dep:tokio-rustls",
    "dep:tower",
    "tokio/net",
    "tokio/io-util",
    "tokio/signal",
]
harness = []

[[bin]]
name = "zapper"
path = "src/main.rs"
required-features = ["gui"]

# The recording service (docs/recording.md). Built on its own, without the
# GUI: `cargo build --no-default-features --features server --bin zapper-server`.
[[bin]]
name = "zapper-server"
path = "src/bin/zapper_server.rs"
required-features = ["server"]

# Records from the fixture server through a real zapper-server, with a forced
# switch to the backup feed, and checks what it wrote.
[[bin]]
name = "recording_check"
path = "src/bin/recording_check.rs"
required-features = ["harness", "server"]

# Records what a headless mpv is watching on an account of one connection:
# the player moves onto zapper-server's connection, and its buffer becomes
# the recording's first part.
[[bin]]
name = "handover_check"
path = "src/bin/handover_check.rs"
required-features = ["harness", "gui"]

# Installs the recording service as Settings > Recording does (the sign-in
# task on Windows, the LaunchAgent on macOS, the systemd user unit on Linux),
# on a scratch home, checks
# that it answers, and removes it.
[[bin]]
name = "service_check"
path = "src/bin/service_check.rs"
required-features = ["harness", "server"]

[[bin]]
name = "ipc_check"
path = "src/bin/ipc_check.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "player_check"
path = "src/bin/player_check.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "shot_check"
path = "src/bin/shot_check.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "surface_check"
path = "src/bin/surface_check.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "seek_bench"
path = "src/bin/seek_bench.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "filter_bench"
path = "src/bin/filter_bench.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "open_bench"
path = "src/bin/open_bench.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "ending_check"
path = "src/bin/ending_check.rs"
required-features = ["harness", "gui"]

[[bin]]
name = "live_start_bench"
path = "src/bin/live_start_bench.rs"
required-features = ["harness", "gui"]

[lib]
name = "zapper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
# The remuxer's C file, compiled against the libavformat pkg-config finds.
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }
# On Windows, the Visual C++ runtime linked in rather than loaded from
# vcruntime140.dll, which a fresh Windows does not have: what tauri-build does
# for the app, done for zapper-server too, which is built without it.
static_vcruntime = "3"

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "stream", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
quick-xml = "0.42"
nucleo = "0.5"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
libmpv2 = { version = "7", optional = true }
# libmpv2-sys is named directly for what the safe wrapper does not expose:
# `mpv_request_log_messages`, which is the only place mpv says what HTTP
# status refused a stream (see `ipc::ending`), and on Windows
# `mpv_command_ret` for `screenshot-raw` (the thumbnails). It is already in
# the tree under libmpv2, and covered by the same license entry.
libmpv2-sys = { version = "4", optional = true }
# The updater's check of a downloaded package against the release's
# SHA256SUMS. Already in the tree through Tauri; named here so it is ours.
sha2 = "0.10"
# The chunks a shared connection hands to each recording on it
# (`recording::hub`). Already in the tree under reqwest and hyper.
bytes = { version = "1", optional = true }
# The `Stream` a browser's live stream is answered with (`recording::watch`).
# Already in the tree under axum and reqwest.
futures-core = { version = "0.3", optional = true }
# The recording service's API token. Already in the tree under rustls.
getrandom = { version = "0.3", optional = true }
# zapper-server's HTTP API (MIT), on the hyper and tower the HTTP client
# already brings. Only in the `server` feature.
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio", "query"] }
# The service's own accept loop (`recording::listen`), which decides per
# connection between plain HTTP and TLS and restarts its listeners without
# restarting the service: hyper's HTTP/1 connection, tower's `oneshot` and
# socket2's IPV6_V6ONLY, all already under axum and tokio.
hyper = { version = "1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio", "service"] }
tower = { version = "0.5", optional = true, default-features = false, features = ["util"] }
socket2 = { version = "0.6", optional = true }
# HTTPS for other devices on the network: rustls and its tokio adapter are the
# ones reqwest already builds (on aws-lc-rs), and rcgen (MIT/Apache-2.0) makes
# the self-signed certificate on the same crypto. `time` for its validity,
# already in the tree.
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
time = { version = "0.3", optional = true }
# The sign-in password for other devices, kept as an Argon2id hash
# (RustCrypto, MIT/Apache-2.0). 0.5, on the same `digest` 0.10 as sha2 and
# md-5; the salt comes from getrandom.
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }
# The addresses other devices can reach the service at, listed in Settings
# (MIT/BSD-3-Clause; libc on Unix, the windows-sys already in the tree on
# Windows).
if-addrs = { version = "0.15", optional = true }
# MD5 for HTTP Digest, which is how Tvheadend logs in by default (see
# `tvheadend::digest`). RustCrypto's, on the same `digest` 0.10 that sha2
# already brings, so it is one small crate and nothing under it.
md-5 = "0.10"
# Gzipped XMLTV guides (and the odd gzipped playlist). Already in the tree
# through the PNG stack; named here so it is ours.
flate2 = "1"
# The save and open dialogs for Settings › Data's backups (MIT/Apache-2.0).
# Opened from Rust only: the window has no `dialog:` permission, so the
# webview can neither open one nor name a path to read or write.
tauri-plugin-dialog = { version = "2", optional = true }

# The desktop's media controls (Settings › Playback, off by default): MPRIS on
# Linux, the System Media Transport Controls on Windows. MIT. Its D-Bus
# backend is the `dbus` crate tao already links, and its Windows one the same
# `windows` 0.62, so on both it is the one crate plus `dbus-crossroads`.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
souvlaki = { version = "0.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }

# Symbols out of the already-loaded C library and OpenGL: `setlocale` and libGL for
# the Linux surface, OpenGL for the macOS one. (`localtime_r` is linked directly:
# the static zapper-server cannot load anything at run time.)
[target.'cfg(unix)'.dependencies]
libloading = "0.8"
# `statvfs`, for the free space the recording service reports. Already in
# the tree under nearly everything; only in the `server` feature.
libc = { version = "0.2", optional = true }

# The Windows surface: a child window for mpv to draw into (WindowsAndMessaging,
# Gdi for its black brush, Shell for subclassing the main window so the child
# follows its size), and the local UTC offset (System_Time). The same 0.62
# that tauri, tao and wry already build, so this adds features, not a crate.
[target.'cfg(windows)'.dependencies]
# Com, Ole, Variant and TaskScheduler: the recording service's sign-in task
# (recording::service). Console, Security and Storage_FileSystem:
# zapper-server finding its terminal's console. Services,
# Security_Authorization and Threading: the boot-time Windows service's
# permissions, this user's SID, and asking for elevation to install it
# (recording::service::winsvc); Registry, which ShellExecuteExW needs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The boot-time Windows service (recording::service::winsvc): its entry
# point and control handler in zapper-server, and creating, starting,
# stopping and deleting it through the Service Control Manager. MIT OR
# Apache-2.0, on the windows-sys 0.61 already in the tree; adds widestring.
windows-service = "0.8"

# The macOS surface: a Core Animation OpenGL layer beneath the WKWebView, in
# AppKit's view hierarchy, that mpv's render API draws into. The objc2
# bindings tao and wry already build (Zlib OR Apache-2.0 OR MIT), with the
# features this needs; objc2-open-gl is CGL's, for the layer's pixel format.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSEnumerator", "NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSTimer", "NSUserDefaults", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAOpenGLLayer", "CATransaction", "objc2-core-video", "objc2-open-gl"] }
objc2-open-gl = { version = "0.3", default-features = false, features = ["std", "CGLTypes"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "objc2"] }
dispatch2 = "0.3"

# The MPRIS round trip in `media_keys`'s ignored test, which talks to the
# registration as a desktop would. Already in the tree under tao. Not for musl:
# the static zapper-server's tests run there, with no libdbus to link.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
dbus = "0.9"

[profile.dev]
incremental = true
